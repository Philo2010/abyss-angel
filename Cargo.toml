[package]
name = "abyss-angel"
version = "0.1.0"
edition = "2024"
default-run = "abyss-angel"

[[bin]]
name = "abyss-angel"
path = "src/main.rs"

[[bin]]
name = "gen_schema"
path = "src/bin/gen_schema.rs"

[[bin]]
name = "recalc_dpdg"
path = "src/bin/recalc_dpdg.rs"

[[bin]]
name = "migrate_e207de6"
path = "src/bin/migrate_e207de6.rs"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
sea-orm = { version = "2.0.0-rc", features = [ "sqlx-postgres", "runtime-tokio-native-tls", "macros", "entity-registry", "schema-sync" ] }
ctor = "0.6.0"
serde = "1.0.228"
serde_json = "1.0.145"
phf = { version = "0.12", features = ["macros"] }
reqwest = {version = "0.12.24", features = ["json"] }
uuid = {version = "1.18.1", features = ["v4"] }
bcrypt = "0.17.1"
enum_dispatch = "0.3.13"
chrono = "0.4.42"
async-trait = "0.1.89"
itertools = "0.14.0"
rocket_okapi = "0.9.0"
schemars = {version = "=0.8.16", features = ["chrono", "uuid1"]}

[dependencies.rocket_dyn_templates]
version = "0.2.0"
features = ["tera"]
